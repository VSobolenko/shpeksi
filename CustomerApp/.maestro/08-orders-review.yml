appId: com.pikupo.app
name: My Orders, order detail and rate & review
tags: [orders, review, e2e]
---
# Prereq: a COMPLETED (unreviewed) order for customer@example.com must exist.
# Run `python backend/scripts/seed_completed_order.py` first.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Featured"
    timeout: 30000
# --- Login ---
- tapOn:
    id: "open-navigation-menu"
- tapOn: "Login/Create Account"
- extendedWaitUntil:
    visible: "Get Started!"
    timeout: 15000
- tapOn: "Already a member? Log in"
- extendedWaitUntil:
    visible: "Email or Phone"
    timeout: 15000
- tapOn:
    id: "login-email"
- inputText: "customer@example.com"
- tapOn:
    id: "login-password"
- inputText: "password123"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Featured"
    timeout: 30000
# --- My Orders ---
- tapOn:
    id: "open-navigation-menu"
- tapOn: "My Orders"
- extendedWaitUntil:
    visible: "My Orders"
    timeout: 15000
# The seeded COMPLETED order row is identified by its "ID: ..." label.
# Maestro text selectors are full-string regexes; "ID: .*" matches "ID: ORD-...".
- extendedWaitUntil:
    visible: "ID: .*"
    timeout: 15000
- tapOn: "ID: .*"
- extendedWaitUntil:
    visible: "Thank You!"
    timeout: 15000
# COMPLETED orders show the review entry point.
- assertVisible: "Write a review"
# --- Rate & review ---
- tapOn: "Write a review"
- extendedWaitUntil:
    visible: "Write a Review"
    timeout: 15000
- tapOn:
    id: "star-5"
- tapOn:
    id: "review-description"
- inputText: "Great food, will order again"
- hideKeyboard
- tapOn:
    id: "review-submit"
- extendedWaitUntil:
    visible: "My Orders"
    timeout: 15000
- takeScreenshot: 08-orders-review
