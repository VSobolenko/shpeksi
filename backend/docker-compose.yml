services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-forkly}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change-me}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"${REDIS_PASSWORD:-change-me}\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-forkly}:${MONGO_INITDB_ROOT_PASSWORD:-change-me}@mongo:27017
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-forkly}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-only}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3006}
    expose:
      - "8000"
    # Bound to loopback only: on a server this keeps the API off the public
    # interface (Caddy reaches it over the internal compose network), while
    # locally the API stays reachable on http://localhost:8000 exactly as
    # before.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Only consumed by Caddyfile.prod; empty in development, where the
      # plain-HTTP Caddyfile above is used instead.
      API_ADDRESS: ${API_ADDRESS:-}
      ADMIN_ADDRESS: ${ADMIN_ADDRESS:-}
    volumes:
      # CADDYFILE selects the site config: the development one (API only, plain
      # HTTP) by default, or Caddyfile.prod (API + both frontends, HTTPS).
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Static frontend builds, mounted read-only as /srv in the container.
      # Caddyfile.prod serves /srv/admin and /srv/www from here. The directory
      # is empty (and git-ignored) in development, where it is unused.
      - ./static:/srv:ro

  backup:
    image: mongo:7
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-forkly}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change-me}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-forkly}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
